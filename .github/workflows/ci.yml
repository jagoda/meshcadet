name: CI

# Runs the full host-native test suite + static checks, PLUS a firmware
# cross-compile build gate, on every PR and on every push to main. Toolchain
# version for the host jobs is NOT pinned in this file — it is pinned exactly
# once, at the repo root in `rust-toolchain.toml` (channel "stable" + the
# rustfmt/clippy components), and `rustup show` below just forces that pin to
# resolve/install before the cache and build steps run.
#
# ── Scope: host-testable crates + fmt + clippy, plus a separate firmware job ─
#
# `protocol`, `host`, `xtask`, `ui_sim`, and `ui_perf` are the root Cargo
# workspace's members (see workspace/Cargo.toml's own doc comment) — they
# build and test on stable Rust with no extra tooling, which is exactly what
# the `test`/`fmt`/`clippy` jobs below exercise.
#
# `firmware/` is deliberately a DETACHED workspace (its own `[workspace]`
# table in firmware/Cargo.toml) that cross-compiles for
# `xtensa-esp32s3-espidf` under the Espressif `esp` rustc fork, and its
# build.rs additionally shells out to a native C/FreeType toolchain to
# generate the bundled emoji font and pulls down a full ESP-IDF sysroot via
# `embuild`/`esp-idf-sys`. That toolchain weight is exactly why firmware gets
# its OWN job (`firmware`, below) instead of being folded into `test`/
# `clippy`: a transient Espressif-side install hiccup should never block the
# fast host lane, and the host lane should never wait on the slower firmware
# toolchain bootstrap. The `firmware` job:
#   - installs the Espressif Rust fork via `esp-rs/xtensa-toolchain` (pinned
#     action version) + `ldproxy` (the linker firmware/.cargo/config.toml
#     requires) + the same native build.rs prerequisites as the host jobs
#     (FreeType/DejaVu for the bundled emoji-font gen step, which firmware's
#     build.rs also runs);
#   - caches the ESP-IDF sysroot (`~/.espressif`, `firmware/.embuild`) and the
#     firmware `target/` dir, since ESP-IDF v5.2.2 — pinned once, in
#     firmware/.cargo/config.toml's `ESP_IDF_VERSION`, not here — rebuilds
#     from source on every cold run without it;
#   - runs the project's existing, documented firmware build gate verbatim:
#     `cd firmware && bash check-all-features.sh` (see CONTRIBUTING.md
#     "Building and testing"). That script builds every feature combination
#     (default + diagnostics; the hil combos auto-skip when the
#     hardware-only, gitignored `src/hil_keys.rs` is absent, which it always
#     is on a CI runner) — CI and the manual gate a human runs before landing
#     firmware changes are now the same command, not a re-implementation of
#     it.

#
# ── Path filter: skip entirely on site-only changes ──────────────────────
#
# All five jobs below build/test/lint the Rust workspace or the firmware
# cross-compile — none of them touch `site/` or the pages-*.yml workflows, so
# a PR whose diff is scoped to the GitHub Pages landing site gets nothing
# useful from running them. `paths-ignore` skips the WHOLE workflow (all five
# jobs) when every changed file matches the ignore list; any change outside
# it (any Rust/firmware file, or ci.yml itself) still triggers the full suite
# unchanged. `pages-check.yml`'s own `check` job already covers site-only
# PRs.
#
# This is a plain skip, not a "companion job reports success" shim, because
# it doesn't need to be: ruleset `main` (id 18807600, see
# `gh api repos/jagoda/meshcadet/rulesets/18807600`) has no
# `required_status_checks` rule — only `pull_request`, `required_signatures`,
# `non_fast_forward`, `deletion`. None of these five jobs are GitHub-required
# checks today, so skipping them leaves nothing in "Expected — waiting for
# status" and a site-only PR stays mergeable. If a `required_status_checks`
# rule is ever added to 18807600 naming one of these jobs, this filter would
# reintroduce that deadlock on site-only PRs — switch to a companion
# always-green job (or per-job `if:` guards that still report a conclusion)
# at that point instead of a bare `paths-ignore`.
#
# ── Job-level targeting: skip only the lane a diff can't affect ──────────
#
# The `changes` job (below) buckets the diff into `full` / `host` /
# `firmware` via dorny/paths-filter, and `test`/`fmt`/`clippy`/`firmware`
# each gate on it with a job-level `if:`. This is deliberately NOT another
# `paths-ignore` (workflow-level skip): a job skipped by `if:` still reports
# a "skipped" conclusion, which satisfies a `required_status_checks` rule
# naming that job, whereas a workflow that never triggers at all leaves a
# named required check stuck in "Expected — waiting for status" forever
# (exactly the hazard called out above for the `paths-ignore` site filter).
# So unlike that filter, this scheme stays safe to use even if 18807600
# grows a `required_status_checks` rule later — no follow-up change needed.
# `workflow_dispatch` runs are never filtered (see each gated job's `if:`)
# since a manual run exists specifically to force a full check.
on:
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages-check.yml"
      - ".github/workflows/pages-deploy.yml"
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages-check.yml"
      - ".github/workflows/pages-deploy.yml"
  # Lets a maintainer (or CI verification tooling) kick a run on-demand from
  # any branch without needing an open PR — `gh workflow run ci.yml --ref
  # <branch>`. Purely additive to the required pull_request/push triggers.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect which jobs this diff can affect
    runs-on: ubuntu-latest
    # Full-history checkout below so dorny/paths-filter's git-based
    # comparison (used for the `push` trigger, which diffs against the
    # pre-push commit) always has the commit it needs locally; for
    # `pull_request` the action instead calls the GitHub API and ignores the
    # checkout depth entirely.
    outputs:
      full: ${{ steps.filter.outputs.full }}
      host: ${{ steps.filter.outputs.host }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Anything both lanes depend on, a lockfile, a toolchain pin, or
            # the workflow files themselves — run the full suite, no
            # exceptions. `protocol` and `firmware-core` are root-workspace
            # members that the DETACHED `firmware/` crate also path-deps on
            # (see Cargo.toml's own doc comment), so a change there can flip
            # what firmware builds too, not just the host lane. Root
            # `Cargo.toml` is here rather than under `host` below because
            # `[workspace.dependencies]` version bumps there change what
            # `protocol`/`firmware-core` resolve to even when neither
            # crate's own Cargo.toml text changes.
            full:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'protocol/**'
              - 'firmware-core/**'
              - 'firmware/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'firmware/rust-toolchain.toml'
              - '.github/workflows/**'
            # Root-workspace members `firmware/` does NOT path-dep on (see
            # Cargo.toml's `members` list) — only test/fmt/clippy need to
            # run for these.
            host:
              - 'host/**'
              - 'xtask/**'
              - 'ui_sim/**'
              - 'ui_perf/**'
              - 'perf_loop_model/**'
            firmware:
              - 'firmware/**'

  version-drift-guard:
    name: firmware/Cargo.toml version matches workspace version
    runs-on: ubuntu-latest
    # `firmware/` is a DETACHED workspace (see Cargo.toml's own doc comment
    # and firmware/Cargo.toml's `[workspace]` table) — release-please manages
    # the ONE version at the root `[workspace.package].version` and, via its
    # `extra-files` config (release-please-config.json), also bumps
    # firmware/Cargo.toml's hardcoded `version` field in the same release PR
    # (docs/adr/0004-release-architecture.md). This job is a belt-and-
    # suspenders guard that keeps the two in lockstep regardless: it fails
    # loudly on any PR that bumps one without the other — whether that's a
    # human hand-editing one file, or `extra-files` ever misfiring — instead
    # of the drift going unnoticed until release time.
    steps:
      - uses: actions/checkout@v4

      - name: Compare root workspace version to firmware/Cargo.toml version
        run: |
          set -euo pipefail
          root_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          firmware_version=$(grep -m1 '^version = ' firmware/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "root [workspace.package].version = ${root_version}"
          echo "firmware/Cargo.toml [package].version = ${firmware_version}"
          if [ "${root_version}" != "${firmware_version}" ]; then
            echo "::error::Version drift: root workspace is ${root_version} but firmware/Cargo.toml is ${firmware_version}. firmware/ is a detached workspace (see Cargo.toml doc) — release-please's extra-files config should keep these in lockstep automatically; if you bumped one by hand, bump the other to match in the same PR." >&2
            exit 1
          fi

  vocabulary-hygiene:
    name: no internal-ops vocabulary leaks in public docs
    runs-on: ubuntu-latest
    # This repo is public; its docs (ADRs especially) are sometimes drafted
    # by an internal ops-automation workflow that has its own vocabulary for
    # artifacts/roles that don't exist for an outside reader (a per-task
    # "dossier" file, a "Commander"/"CapCom"/"Flight Director"/"EECOM"/
    # "Surgeon" role, a "flight-manuals" doc tree). Four such leaks
    # (docs/adr/0004-release-architecture.md:295,636 and
    # docs/adr/0008-nondestructive-update-artifacts.md:40,198) were found and
    # fixed 2026-07-29; this job is the regression guard so the next one
    # fails CI instead of shipping. Deliberately NOT "mission" or "Mission
    # Control" — "mission" is used generically throughout the ADRs (e.g.
    # "mission-scoped") and "Mission Control" is this project's own,
    # intentional dark-space/cyan UI theme name (site/*.html, styles.css,
    # firmware/src/ui/theme.slint, firmware/src/ui/screens/splash.rs) — both
    # would false-positive if added here.
    #
    # This job used to be the ONLY write-time-adjacent guard for banned
    # terms landing in tracked file content, which meant it always caught a
    # leak post-hoc — after a PR was already open. scripts/check-commit-
    # format.sh's "Lint commit messages" CI job closes the recurrence path
    # for banned terms in commit *subjects* specifically (release-please
    # bakes those into CHANGELOG.md verbatim on merge, 2026-08-04); it never
    # covered file content, so three more leaks (source comments, an ADR
    # paragraph) went through that gap. scripts/check-vocabulary-leak.sh
    # closes it: this job and CONTRIBUTING.md's pre-PR-publish step both
    # invoke that ONE script (which itself sources
    # scripts/banned-vocabulary.sh), so the scan's scope — not just its term
    # list — can never drift apart between local and CI.
    steps:
      - uses: actions/checkout@v4

      - name: Self-test scripts/check-vocabulary-leak.sh
        # Regression guard on the shared script itself (isolated throwaway
        # repo, not this checkout's tracked files) — a future edit that
        # silently narrows the scan scope fails loudly here instead of
        # quietly reopening the local/CI scope gap this script exists to
        # close.
        run: scripts/check-vocabulary-leak.test.sh

      - name: Grep for internal-ops vocabulary
        run: scripts/check-vocabulary-leak.sh

  test:
    name: cargo test --workspace --locked
    needs: changes
    # See the `changes` job above. `workflow_dispatch` always runs the full
    # suite regardless of what the filter computed. `needs.changes.result !=
    # 'success'` is a fail-SAFE, not a typo: an explicit job `if:` replaces
    # the implicit "only run if all `needs` succeeded" check entirely, so
    # without this clause a `changes` job failure (dorny/paths-filter action
    # hiccup, an unresolvable git diff on some edge-case history) would leave
    # every output unset/false and silently SKIP this job — a "skipped"
    # conclusion that still satisfies a `required_status_checks` rule, i.e. a
    # broken filter would silently pass PRs with zero Rust testing. Treat
    # "the filter didn't run cleanly" the same as "the filter said run it".
    if: github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native prerequisites for the host-native workspace's build.rs steps
      # (ui_sim / ui_perf embed real Slint markup + assets at compile time via
      # the same i-slint-compiler machinery firmware uses) — see README.md
      # "Building from a fresh clone" for the authoritative package list.
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfreetype6-dev fonts-dejavu-core

      # Resolves rust-toolchain.toml (channel + rustfmt/clippy components) —
      # the toolchain pin lives there, not in this workflow.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  fmt:
    name: cargo fmt --check
    needs: changes
    # See the `changes` job above and the fail-safe note on `test`'s `if:`.
    if: github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    needs: changes
    # See the `changes` job above and the fail-safe note on `test`'s `if:`.
    if: github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfreetype6-dev fonts-dejavu-core

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  firmware:
    name: firmware build gate (check-all-features.sh)
    needs: changes
    # See the `changes` job above and the fail-safe note on `test`'s `if:`.
    if: github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `test`'s job-level `if:` (above) only runs `cargo test --workspace`
      # — which is where all 17 xtask static guards (pm_apb_lock_gate,
      # lock_gate, lock_integrity_fixes, render_asleep_gate,
      # ui_event_parity, power_provenance, slint_thread_affinity, the
      # glyph/font-table/emoji-subset trio, and the seven room_* guards)
      # actually execute, as #[test]s — when `needs.changes.outputs.full`
      # and `.host` are both false. A firmware-only diff (this job's own
      # trigger condition) sets exactly that, so without this step every
      # guard above is silently skipped on precisely the PRs whose diffs
      # they exist to scan (firmware/src/**). `cargo run -p xtask --bin
      # xtask` (no args) runs the identical checks as a host-native binary
      # instead of via `cargo test` — same pure static source scan, no `esp`
      # cross-toolchain needed — printing a report and exiting non-zero on
      # any violation. Placed before the esp-toolchain install below so a
      # guard violation fails fast without waiting on that bootstrap.
      - name: cargo run -p xtask --bin xtask (static guard battery)
        run: cargo run -p xtask --bin xtask

      # Same native build.rs prerequisites as the host jobs (see comment
      # above `test`) — firmware/build.rs runs the identical FreeType/DejaVu
      # emoji-font gen step.
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfreetype6-dev fonts-dejavu-core

      # Installs the Espressif `esp` Rust fork (Xtensa target support) via
      # espup, restricted to esp32s3 since that's the only MCU this project
      # targets (see firmware/.cargo/config.toml). `GITHUB_TOKEN` avoids
      # espup's unauthenticated-GitHub-API rate limit (see the action's own
      # README).
      - name: Install Rust for Xtensa (esp toolchain)
        uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32s3

      # firmware/.cargo/config.toml's [target.xtensa-esp32s3-espidf] linker
      # is `ldproxy` — same install command README.md documents for local
      # dev setup.
      - name: Install ldproxy
        run: cargo install ldproxy --locked

      # ESP-IDF v5.2.2 is pinned once, in firmware/.cargo/config.toml's
      # ESP_IDF_VERSION (not re-pinned here) — esp-idf-sys bootstraps that
      # sysroot into ~/.espressif and firmware/.embuild on first build.
      # Without caching it, every run rebuilds the sysroot from source.
      - name: Cache ESP-IDF sysroot
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            firmware/.embuild
          key: esp-idf-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml', 'firmware/Cargo.lock') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "firmware -> target"

      # `firmware/` is a DETACHED workspace (its own `[workspace]` table in
      # firmware/Cargo.toml — see this file's header comment), so the root
      # `fmt`/`clippy` jobs above, which run `cargo fmt --all`/`cargo clippy
      # --workspace` from the repo root, can never reach it: root-workspace
      # `cargo fmt --all`/`cargo clippy --workspace` only walks the members
      # listed in the ROOT Cargo.toml's `[workspace]` table, and `firmware`
      # is not one of them, so firmware/ source has never been fmt- or
      # clippy-checked by CI at all. Adding `cd firmware && cargo fmt --all
      # -- --check` / `cd firmware && cargo clippy --all-targets -- -D
      # warnings` steps here was tried in this same change and reverted —
      # both fail today on real, pre-existing debt, not a config mistake:
      # fmt reports 447 diffs across 30 files, clippy reports 56 findings
      # (mostly `clippy::doc_lazy_continuation`/`doc_markdown` on doc
      # comments, plus real ones: unused imports, dead code, a `Box` that
      # doesn't need boxing, `payload.get(0)` instead of `.first()`, a
      # `CStr::from_bytes_with_nul` that should be a `c""` literal). Landing
      # either gate as-is would turn CI red on the very next PR, for every
      # contributor, with no relation to their own change — see
      # CONTRIBUTING.md's "Known gaps" for the counts and the follow-up this
      # needs before either check can land. `cargo fmt`/`cargo clippy` on
      # `firmware/` remain a pre-submit human step (see "Code style" below)
      # until that cleanup lands.
      #
      # The canonical firmware build gate — same command CONTRIBUTING.md
      # documents for a human to run manually before landing firmware
      # changes. Builds default (production) + diagnostics; the hil combos
      # auto-skip since src/hil_keys.rs is gitignored/absent on a CI runner.
      - name: cd firmware && bash check-all-features.sh
        run: cd firmware && bash check-all-features.sh

      # Recomputes the actual RELEASE app-image size from a fresh build and
      # diffs it against the committed baseline
      # (firmware/app-image-budget-baseline.txt), failing loudly past a 5%
      # drift — see xtask/src/partition_budget.rs's module doc for why this
      # exists (firmware/partitions.csv's `factory` comment used to carry
      # this figure as hand-written "measured" prose with no recompute
      # trigger, and it decayed 2.72 MB stale, undetected, across an entire
      # campaign's worth of flash-budget decisions). Deliberately its own
      # step, after check-all-features.sh (a debug build): this one needs an
      # actual `cargo build --release`, which check-all-features.sh does
      # not run. Runs from the repo root (not `firmware/`) because the
      # `xtask` binary itself is a host-native crate — see that module's
      # doc for why the nested release build still resolves the `esp`
      # toolchain correctly via rustup's per-directory rust-toolchain.toml.
      - name: cargo run -p xtask -- verify-partition-budget
        run: cargo run -p xtask --bin xtask -- verify-partition-budget
