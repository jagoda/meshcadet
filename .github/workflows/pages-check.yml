name: Pages Check

# PR-facing regression guard for the site's one hard rule (relative paths
# only — see check-relative-paths below and site/README.md "Conventions"),
# PLUS the provisioning-codec conformance guard (see the `codec-conformance`
# job below). Deliberately pull_request-only and deliberately does NOT build
# or deploy anything: pages-deploy.yml owns build/upload-pages-artifact/
# deploy-pages and only fires on push to main, so a site PR's checks list
# shows this validation and nothing about deploy (no more "build"/"deploy"
# showing as skipped on every PR).
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages-check.yml"
      # `codec-conformance` (below) guards site/provisioner/codec.js against
      # drift from protocol::provisioning / the FRAME_RSP_HISTORY_ENTRY codec
      # in protocol::history — the wire-format source of truth. Without these
      # paths, a PR that changes ONLY the Rust side (no site/** touch) would
      # never trigger this workflow, and byte-exact drift could land silently.
      # See docs/adr/0007-provisioner-codec.md.
      - "protocol/src/provisioning.rs"
      - "protocol/src/history.rs"
      - "xtask/src/golden.rs"
      - "xtask/src/bin/gen_prov_golden_vectors.rs"
      - "xtask/Cargo.toml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject root-absolute asset/href paths
        # This is a PROJECT Pages site (served at /meshcadet/, not a root
        # site), so any href/src starting with "/" 404s in production even
        # though it works from a local file:// or `python3 -m http.server`
        # preview. Guard the mission's core acceptance criterion so a future
        # page/section can't silently regress it.
        run: |
          if grep -rnE '(href|src)="/' site --include='*.html'; then
            echo "::error::found a root-absolute href/src in site/ — this is a project Pages site (/meshcadet/…), paths must be relative (e.g. \"assets/foo.png\", not \"/assets/foo.png\")"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: upgrade-gate.js validates update-meta.json before the Upgrade path is ever offered
        # site/upgrade-gate.js's isValidUpdateMeta is the safety-critical gate
        # deciding whether flash.html's non-erasing Upgrade path is offered
        # (and, defense-in-depth, whether it ever writes a byte) for a given
        # release — see docs/adr/0008-nondestructive-update-artifacts.md D2/D4
        # and docs/adr/0009-two-path-flasher.md D2. Plain-node coverage
        # independent of a browser/DOM, same pattern as validation.js below.
        run: node site/upgrade-gate.test.mjs

      - name: flash-manifest.js picks the right Fresh-install flash address before a byte is written
        # site/flash-manifest.js's resolveFreshInstallParts is the Fresh-
        # install counterpart to upgrade-gate.js above: it decides which
        # bytes get written to which flash address from manifest.json, and
        # fails closed on anything malformed/unexpected — see
        # docs/adr/0011-unified-esptool-js-flasher.md.
        run: node site/flash-manifest.test.mjs

      - name: flash-image-encoding.js's ui8ToBstr matches esptool-js's writeFlash data-type contract
        # site/flash-image-encoding.js converts each downloaded firmware
        # image from a Uint8Array to the Latin-1 binary string esptool-js's
        # ESPLoader.writeFlash actually requires for fileArray[].data — see
        # the module's own header for the "A.charCodeAt is not a function"
        # mid-write crash this closes (both Fresh install and Upgrade wrote
        # a Uint8Array straight through before this fix). Plain-node
        # round-trip coverage of the data-type boundary; the real write
        # itself is verified against hardware, not this suite.
        run: node site/flash-image-encoding.test.mjs

      - name: session.js orchestration smoke test (mocked Web Serial)
        # site/provisioner/session.js (the async Web Serial transport +
        # QUERY_STATUS handshake driving provisioner.html) has no Rust
        # counterpart to golden-vector against (unlike codec.js — see the
        # codec-conformance job below) — host/src/session.rs is synchronous
        # and is never itself modified by this code (see
        # docs/adr/0007-provisioner-codec.md, Finding 2). This is its own
        # regression coverage instead: retry/resync orchestration exercised
        # against a fake `navigator.serial` port built from Node's built-in
        # WHATWG Streams globals. See the test file's own header for details.
        run: node site/provisioner/session.smoke.test.mjs

      - name: contact-uri.js matches host/src/main.rs's url_encode + URI construction
        # Checked against the SAME fixtures as host/src/main.rs's own
        # #[cfg(test)] module — see the test file's own header.
        run: node site/provisioner/contact-uri.test.mjs

      - name: validation.js's hex/byte-length checks match host/src/main.rs's CLI parsers
        # site/provisioner/validation.js is the M2 write-form counterpart to
        # host/src/main.rs's `parse_32bytes_hex`/`parse_channel_secret_hex`/
        # the `Cmd::Identity` set-name length check plus the sensitive-data
        # `validatePin` (mirrors MAX_PIN_LEN) — see the test file's own header.
        run: node site/provisioner/validation.test.mjs

      - name: history-format.js matches host/src/history_format.rs's transcript columns
        # site/provisioner/history-format.js is the DOM-free port of
        # host/src/history_format.rs (the export-history transcript renderer);
        # this asserts the same header/data column-alignment invariant the
        # Rust module's own tests do. See the test file's own header.
        run: node site/provisioner/history-format.test.mjs

      - name: csp — every page carries its Content-Security-Policy, and no page/script anywhere CDN-imports a third-party script
        # meshcadet-channel-secret-leak-security-audit finding B3: GitHub
        # Pages can't set response headers, so each site/*.html page's CSP
        # <meta> tag is the only enforcement mechanism. Also covers
        # meshcadet-flasher-cdn-import-unpinned-integrity finding F6 and
        # meshcadet-cdn-import-coverage-check: rather than a hand-written
        # assertion block per page/script (added reactively, once per prior
        # CDN-import incident — qrcode.js into provisioner.js, then
        # esptool-js into flash.js), this test ENUMERATES every
        # site/*.html's script-src (falling back to default-src) and every
        # JS file reachable from each page's module entry point, so a third
        # CDN-import instance into a new page or script fails CI
        # automatically. See the test file's own header for why this is a
        # static-source assertion, not a driven-browser test, and for why
        # it's shaped as domain enumeration rather than a per-instance check.
        run: node site/csp.test.mjs

      - name: guest-password-hygiene — the room guest password never reaches storage/console/URL and is cleared on disconnect
        # meshcadet-room-web-provisioner's binding scope requirement: drives
        # session.js's addRoom for real against hostile localStorage/
        # sessionStorage traps + a console spy, then statically asserts
        # provisioner.js/provisioner.html's source text upholds the rest
        # (no URL/history manipulation, type="password" + autocomplete="off",
        # the password field cleared on every handleAddRoom exit path and on
        # disconnect). See the test file's own header for why it's split
        # from session.smoke.test.mjs this way.
        run: node site/provisioner/guest-password-hygiene.test.mjs

      - name: admin-pin-hygiene — the admin PIN never reaches storage/console/URL and is cleared on every exit path
        # Mirrors guest-password-hygiene.test.mjs for the other browser secret
        # this page carries: drives session.js's setPin for real against
        # hostile localStorage/sessionStorage traps + a console spy, then
        # statically asserts provisioner.js/provisioner.html's source text
        # upholds the rest (no URL/history manipulation, type="password" +
        # autocomplete="off", the PIN field cleared on every handleSetPin
        # exit path — success AND catch — and on disconnect). See the test
        # file's own header for why it's split from session.smoke.test.mjs
        # this way.
        run: node site/provisioner/admin-pin-hygiene.test.mjs

      - name: channel-secret-hygiene — the channel secret never reaches storage/console/URL and is cleared on every exit path
        # Mirrors admin-pin-hygiene.test.mjs/guest-password-hygiene.test.mjs
        # for the THIRD browser secret this page carries: drives session.js's
        # addChannel/delChannel for real against hostile localStorage/
        # sessionStorage traps + a console spy, then statically asserts
        # provisioner.js/provisioner.html's source text upholds the rest (no
        # URL/history manipulation, type="password" + autocomplete="off" on
        # both add-channel-secret and del-channel-secret, the secret field
        # cleared on every handleAddChannel/handleDelChannel exit path —
        # success AND catch — and on disconnect). See the test file's own
        # header for why it's split from session.smoke.test.mjs this way.
        run: node site/provisioner/channel-secret-hygiene.test.mjs

      - name: channel-secret-recoverability — a generated channel secret has a Show toggle + Copy button and an explicit ack gate before an unconfirmed one is added
        # Regression coverage for meshcadet-provisioner-channel-secret-uncopyable:
        # a generated secret used to land in a type="password" field with no
        # way to reveal or copy it, so an operator could add a channel
        # without ever having saved its secret — and because del-channel
        # needs the exact secret (the channels table only shows a 1-byte
        # hash), that channel was then permanently unremovable. Statically
        # asserts the Show/Copy affordances exist and are wired up, and that
        # handleAddChannel gates on an explicit checkbox acknowledgement
        # whenever the current secret was never revealed or copied. See the
        # test file's own header.
        run: node site/provisioner/channel-secret-recoverability.test.mjs

      - name: lock-pin-hygiene — the screen-lock PIN never reaches storage/console/URL and is cleared on every exit path
        # Mirrors admin-pin-hygiene.test.mjs/guest-password-hygiene.test.mjs/
        # channel-secret-hygiene.test.mjs for the FOURTH browser secret this
        # page carries: drives session.js's setLockPin for real against
        # hostile localStorage/sessionStorage traps + a console spy, then
        # statically asserts provisioner.js/provisioner.html's source text
        # upholds the rest (no URL/history manipulation, type="password" +
        # inputmode="numeric" + autocomplete="off", the PIN field cleared on
        # every handleSetLockPin exit path — success AND catch — and on
        # disconnect). See the test file's own header for why it's split
        # from session.smoke.test.mjs this way, and for why the lock PIN
        # (unlike the admin PIN) must be exactly 4 ASCII digits.
        run: node site/provisioner/lock-pin-hygiene.test.mjs

      - name: secret-hygiene-coverage — every type="password" field in provisioner.html has a matching hygiene test
        # Closes a coverage gap: the three hygiene tests above were each added reactively,
        # one field at a time, only after an incident noticed that field was
        # uncovered — nothing previously asserted the SET of hygiene tests
        # actually spans the SET of secret-carrying fields. This enumerates
        # every type="password" <input> in provisioner.html and asserts its
        # id is mentioned by at least one *-hygiene.test.mjs file, so a fourth
        # secret field added without a matching hygiene test fails here
        # immediately instead of waiting for the next security audit. See the
        # test file's own header.
        run: node site/provisioner/secret-hygiene-coverage.test.mjs

  codec-conformance:
    name: site/provisioner/codec.js matches protocol::provisioning byte-for-byte
    runs-on: ubuntu-latest
    # `site/provisioner/codec.js` is a hand-ported, pure-JS reimplementation
    # of protocol::provisioning (+ the FRAME_RSP_HISTORY_ENTRY payload codec
    # in protocol::history) — see docs/adr/0007-provisioner-codec.md for why
    # it's pure JS instead of a WASM build of `protocol` (keeps the site's
    # "no build step, on purpose" convention, site/README.md). A hand port
    # has no compiler to catch wire-format drift, so this job is the guard:
    # it generates golden vectors straight from the real Rust codec, then
    # asserts the JS codec reproduces every one byte-for-byte / field-for-
    # field. Fails loud (nonzero exit) on any mismatch — see
    # site/provisioner/codec.conformance.test.mjs's own header for how to
    # reproduce this locally.
    steps:
      - uses: actions/checkout@v4

      # Resolves rust-toolchain.toml (channel + rustfmt/clippy components) —
      # the toolchain pin lives there, not in this workflow. Same pattern as
      # ci.yml's host-native jobs.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate golden vectors from the real Rust codec
        run: cargo run -q -p xtask --bin gen-prov-golden-vectors --locked > /tmp/prov-golden-vectors.json

      - name: Assert codec.js reproduces every golden vector byte-for-byte
        run: node site/provisioner/codec.conformance.test.mjs /tmp/prov-golden-vectors.json
