version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "slint"
        versions:
          - ">=1.17.0"
      - dependency-name: "slint-build"
        versions:
          - ">=1.17.0"
      - dependency-name: "i-slint-core"
        versions:
          - ">=1.17.0"
      - dependency-name: "aes"
        versions:
          - ">=0.9.0"
      - dependency-name: "sha2"
        versions:
          - ">=0.11.0"
      - dependency-name: "hmac"
        versions:
          - ">=0.13.0"
      - dependency-name: "ed25519-dalek"
        versions:
          - ">=3.0.0"
      - dependency-name: "x25519-dalek"
        versions:
          - ">=3.0.0"
      - dependency-name: "curve25519-dalek"
        versions:
          - ">=5.0.0"
      # rand/rand_core 0.9 is an intermediate breaking step of the atomic
      # rand/rand_core 0.10 + RustCrypto 0.11 migration; do not let it land
      # separately (the >=0.10.0 floors left it exposed).
      - dependency-name: "rand"
        versions:
          - ">=0.9.0"
      - dependency-name: "rand_core"
        versions:
          - ">=0.9.0"

  - package-ecosystem: "cargo"
    directory: "/firmware"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      firmware-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "slint"
        versions:
          - ">=1.17.0"
      - dependency-name: "slint-build"
        versions:
          - ">=1.17.0"
      - dependency-name: "i-slint-core"
        versions:
          - ">=1.17.0"
      # Pre-1.0 crates: a 0.x minor bump is breaking (0.37 -> 0.38, 0.46 ->
      # 0.47, 0.52 -> 0.53), and each tracks a different ESP-IDF release.
      # Use explicit floors rather than semver-major update-types.
      - dependency-name: "esp-idf-sys"
        versions:
          - ">=0.38.0"
      - dependency-name: "esp-idf-hal"
        versions:
          - ">=0.47.0"
      - dependency-name: "esp-idf-svc"
        versions:
          - ">=0.53.0"
      - dependency-name: "color_quant"
        versions:
          - ">=2.0.0"
      - dependency-name: "aes"
        versions:
          - ">=0.9.0"
      - dependency-name: "sha2"
        versions:
          - ">=0.11.0"
      - dependency-name: "hmac"
        versions:
          - ">=0.13.0"
      - dependency-name: "ed25519-dalek"
        versions:
          - ">=3.0.0"
      - dependency-name: "x25519-dalek"
        versions:
          - ">=3.0.0"
      - dependency-name: "curve25519-dalek"
        versions:
          - ">=5.0.0"
      # Same atomic-migration guardrail as the root Cargo entry: 0.9 is a
      # breaking intermediate step, not a standalone upgrade.
      - dependency-name: "rand"
        versions:
          - ">=0.9.0"
      - dependency-name: "rand_core"
        versions:
          - ">=0.9.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
